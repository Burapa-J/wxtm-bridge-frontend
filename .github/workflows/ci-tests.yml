name: 'Run tests on commit'

on: [push]

env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_VERSION: 22

jobs:
  tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@master
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://npm.pkg.github.com'

      - name: Cache NPM dependencies
        uses: pat-s/always-upload-cache@v2.1.5
        with:
          path: |
            node_modules
          key: ${{ runner.OS }}-npm-cache-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.OS }}-npm-cache-

      - name: Install dependencies
        run: |
          yarn config set //npm.pkg.github.com/download/:_authToken ${{ env.NODE_AUTH_TOKEN }}
          yarn config set @tari-project:registry https://npm.pkg.github.com
          yarn --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: No Base chain id literals outside utils/evm-chains.ts
        run: |
          if git grep -InE '8453|84532' -- ':!utils/evm-chains.ts' ':!contracts/deployments.json' ':!yarn.lock' ':!package-lock.json' ':!.github/workflows/ci-tests.yml'; then
            echo "Chain ids belong in utils/evm-chains.ts"
            exit 1
          fi
